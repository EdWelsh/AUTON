# Two hosts, because one of them can do something the other cannot.
#
# The development host is Darwin/arm64. A cross toolchain builds an x86 kernel
# there, but nothing executes x86 instructions, so `identity_test.c`'s live
# CPUID cross-check prints SKIP — and H5's last acceptance criterion ("captured
# identity cross-checks against the host's own view") has never been satisfied
# anywhere. A Linux x86-64 runner satisfies it for free.
#
# Scope is deliberately the cheap subset: unit suites and the spine's
# self-tests. No training, no torch, no corpus — the kernel loop needs none of
# them, and a job that takes an hour gets disabled.

name: portability

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-14          # arm64
            label: darwin-arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the kernel-base tags; see scripts/kernel-base.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install python deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q pytest pyyaml pdfplumber

      - name: Unit suites
        run: |
          cd agent && ../.venv/bin/python -m pytest tests/unit/ -q

      - name: SLM suites
        run: .venv/bin/python -m pytest SLM/tests/ -q

      # The reason this matrix exists. On linux-x86_64 the live cross-check
      # runs; on darwin-arm64 it prints SKIP and the folding vectors still
      # validate the formula. Both are a pass — silence is not.
      - name: Silicon identity
        run: tests/kernel/run_identity_test.sh --self-test

      - name: Allocator suite
        run: tests/kernel/run_mm_test.sh --self-test

      - name: VMM suite
        run: tests/kernel/run_vmm_test.sh --self-test

      # F7: FAT32 is proved against mtools (an independent implementation),
      # with fsck.fat as a second structural check.
      - name: Install FAT tooling
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -yq mtools dosfstools;
          else brew install mtools dosfstools; fi

      - name: FAT32 suite
        run: tests/kernel/run_fat32_test.sh --self-test

      - name: Boot-info suite (BIOS and UEFI tag shapes)
        run: tests/kernel/run_boot_info_test.sh --self-test

      # Proves the live path actually ran rather than skipping, on the one host
      # where it can. Without this the matrix could be green with both hosts
      # skipping and nobody noticing.
      - name: Assert the live CPUID check ran (x86 only)
        if: matrix.label == 'linux-x86_64'
        run: |
          out=$(tests/kernel/run_identity_test.sh --self-test)
          echo "$out"
          if echo "$out" | grep -q "SKIP.*live CPUID"; then
            echo "::error::live CPUID cross-check skipped on an x86 host" >&2
            exit 1
          fi
          echo "$out" | grep -q "live CPU:" || {
            echo "::error::no live CPU line — the cross-check did not run" >&2
            exit 1
          }

      # A2: the accelerator probe against a real host, not a synthetic list.
      # GitHub's x86 Linux runners expose /dev/kvm but not to the runner user
      # until a udev rule grants it, so this also proves the "listed is not
      # usable" check reads the device rather than trusting `-accel help`.
      - name: Accelerator probe selects kvm (x86 Linux only)
        if: matrix.label == 'linux-x86_64'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq qemu-system-x86
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          bash -c 'source scripts/lib/toolchain.sh && auton_accel && echo "$AUTON_ACCEL: $AUTON_ACCEL_REASON" && [ "$AUTON_ACCEL" = kvm ]'

  # windows-linux A1: the e2e spine on a Linux host, and B1's measurement (the
  # same ISO under KVM and under TCG on one runner). The run must match
  # docs/E2E-EXPECTED.yaml exactly: red only where that file says, with the
  # plan that clears it. Proxmox confirms B1 later (w15-portability-proxmox).
  linux-e2e:
    runs-on: ubuntu-latest
    name: linux-e2e (A1, B1 measurement)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the kernel-base tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Toolchain (the apt list A1 documents)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq gcc clang grub-pc-bin grub-common grub-efi-amd64-bin \
            xorriso qemu-system-x86 ovmf mtools
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Python + CPU torch (rung 3a trains in CI; parity needs torch)
        run: |
          python -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q --index-url https://download.pytorch.org/whl/cpu torch
          .venv/bin/pip install -q numpy pyyaml pytest

      - name: Kernel base
        run: scripts/kernel-base.sh "$RUNNER_TEMP/tree"

      - name: Preflight
        run: CHECK_E2E=1 scripts/preflight.sh

      - name: e2e spine (rung 3a)
        run: scripts/e2e.sh --target "$RUNNER_TEMP/tree" || true

      - name: Matches docs/E2E-EXPECTED.yaml
        run: .venv/bin/python scripts/e2e-expect.py

      - name: e2e spine under UEFI (B3), same expectation
        run: |
          scripts/e2e.sh --target "$RUNNER_TEMP/tree" --skip-train --firmware uefi || true
          .venv/bin/python scripts/e2e-expect.py

      - name: B1 measurement — same ISO, kvm then tcg
        run: |
          make -C "$RUNNER_TEMP/tree" iso
          scripts/time-boot.sh "$RUNNER_TEMP/tree/build/auton.iso" 3 --accel kvm | tee kvm.txt
          scripts/time-boot.sh "$RUNNER_TEMP/tree/build/auton.iso" 3 --accel tcg | tee tcg.txt
          python3 -c "
          import re
          k=float(re.search(r'mean: ([\d.]+)',open('kvm.txt').read()).group(1))
          t=float(re.search(r'mean: ([\d.]+)',open('tcg.txt').read()).group(1))
          print(f'B1 ratio on this runner: tcg/kvm = {t/k:.1f}x (kvm {k}s, tcg {t}s)')"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-e2e
          path: |
            .artifacts/e2e
            kvm.txt
            tcg.txt
