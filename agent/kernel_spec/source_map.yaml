# Which source paths implement which capability.
#
# The capability index (subsystems/*.md front-matter) says what a subsystem
# provides. This says where that lives in a kernel tree, which is the last hop
# between a manifest and a link command.
#
# It is data rather than a path convention because the mapping is genuinely not
# one-to-one: `net` is kernel/net/ AND the e1000 driver; `mm` is one file inside
# kernel/lib/ in the seed tree; `lib` has no spec at all and is in every image.
#
# Paths are globs relative to a kernel tree's root, matched against .c and .S.
#
# WHAT AN ABSENT MAPPING MEANS, AND WHAT NOW HAPPENS
#
# A capability with no entry here means *this tree does not implement it*. Since
# w6 that is a build failure when a service spec requires it directly:
# `build_service.py`'s `[gate: capabilities]` refuses rather than building an
# image that quietly lacks the driver. The information was always correct —
# `resolve()` has computed `unmapped_capabilities` all along — it was simply
# reported into a field nothing read. A manifest requiring `nvme` resolved to a
# closed slice, passed every gate, and produced an image with no storage driver.
#
# 27 capabilities across 11 subsystems are unmapped today, and most of that is
# correct information rather than a defect: this map is per-tree, and the seed
# tree never implemented `ipc`, `sched`, `fs` or `pkg`. `nvme` and `ahci` are
# specified in subsystems/drivers.md and were never written.
#
# DO NOT "FIX" THEM BY INVENTING MAPPINGS. A path to a directory that does not
# exist resolves without error, because a glob matching nothing is not an error
# — so an invented mapping turns a refusal into a silent omission, which is the
# defect the gate exists to prevent, not its cure.
#
# That third state — mapped, with nothing behind the mapping — is now DETECTED.
# `resolve()` reports `phantom_capabilities` alongside `unmapped_capabilities`,
# and `[gate: capabilities]` refuses a directly-required one, naming the pattern
# that matched nothing. A capability is phantom only when *every* one of its
# patterns matches nothing, so a partial map does not fire it.
#
# The rule that follows: when a capability is specified but not implemented,
# give it a `provides` entry in the subsystem spec and NO entry here. An absent
# mapping refuses honestly; one that lies does not. `virtio-net` is the worked
# example — specified in subsystems/drivers.md, deliberately unmapped.

version: 1

# Every image contains these regardless of manifest. Justified in
# .claude/PRPs/reports/w2-factory-dependency-audit.md — the audit measured
# what is depended on by three or more subsystems.
# Capabilities the mandatory core provides. Declared so they are not reported
# as unmapped — a warning that fires on every build teaches a reader to ignore
# it, and then the real case goes unnoticed.
core_provides: [arch, boot-info, multiboot2, early-serial, slm-handoff, klog,
                module-load, serial]

mandatory_core:
  - kernel/arch/**            # the HAL; no image boots without it
  - kernel/boot/**            # entry point and Multiboot2 parsing
  - kernel/lib/kprintf.c      # every subsystem calls it, including arch
  - kernel/lib/kstr.c
  - kernel/lib/kmath.c
  - kernel/lib/string.c
  # Every image emits [BOOT], [MM] and [DEV] markers before anything else
  # exists, so the console is core. The audit found `drivers` depended on by
  # four subsystems for exactly this reason.
  - kernel/sys/console.c
  - kernel/drivers/arch/**

capabilities:
  # --- mm ---
  allocator:   [kernel/lib/phys.c]      # the seed's bump allocator; a generated
  pmm:         [kernel/lib/phys.c]      # tree puts these under kernel/mm/
  # vmm, slab: specified in subsystems/mm.md, not implemented. Both mapped to
  # files that have never existed in any tree (kernel/mm/vmm.c, slab.c), which
  # made them phantom: F00F's `requires: [vmm]` resolved against nothing. The
  # VMM's REQUIRED sections and host suite landed in w12
  # (tests/kernel/run_vmm_test.sh); a generated tree maps them again once its
  # vmm.c passes that suite. An absent mapping refuses honestly.

  # --- dev ---
  pci:             [kernel/dev/pci.c]
  device-registry: [kernel/dev/**]
  driver-binding:  [kernel/dev/**]

  # --- drivers ---
  serial:      [kernel/sys/console.c, kernel/drivers/arch/**]
  timer:       [kernel/drivers/arch/**]
  keyboard:    [kernel/drivers/arch/**]
  input:       [kernel/drivers/arch/**]
  # framebuffer: specified in subsystems/drivers.md (Multiboot2 handover), not
  # implemented. It mapped to kernel/drivers/fb/**, a directory that has never
  # existed. Removed for the reason stated in the header: an absent mapping
  # refuses honestly, one that lies does not.
  e1000:       [kernel/net/e1000.c]     # a NIC driver, but it lives with the stack
  # virtio-blk: specified in subsystems/drivers.md, not implemented. It mapped
  # to kernel/drivers/blk/**, a directory that has never existed — which passed
  # every gate until V1a made that detectable. No entry is the truthful state:
  # an absent mapping refuses honestly, one that lies does not.

  # --- net ---
  netif:       [kernel/net/netif.c, kernel/net/setup.c]
  ethernet:    [kernel/net/netif.c]
  arp:         [kernel/net/arp.c]
  ipv4:        [kernel/net/ipv4.c]
  icmp:        [kernel/net/ipv4.c]
  udp:         [kernel/net/ipv4.c]
  tcp:         [kernel/net/tcp.c]
  dhcp-client: [kernel/net/dhcp.c]
  dns:         [kernel/server/dns.c]
  http-server: [kernel/server/http.c, kernel/server/serve.c]
  http-client: [kernel/server/http.c]
  sockets:     [kernel/net/ipv4.c]   # datagram path; tcp.c comes via `tcp`

  # --- slm ---
  rule-engine:          [kernel/slm/slm.c, kernel/slm/roles.c]
  intent-classify:      [kernel/slm/slm.c]
  knowledge-base:       [kernel/slm/slm.c]
  scoped:               [kernel/slm/slm.c]
  neural:               [kernel/slm/neural/**]
  conversation-context: [kernel/slm/chat.c]

  # --- sys ---
  terminal:         [kernel/slm/chat.c]      # the chat REPL is the terminal
  klog:             [kernel/lib/kprintf.c]
  uptime:           [kernel/slm/sysinfo.c]
  resource-monitor: [kernel/slm/sysinfo.c]
