# Encodings the SDM guarantees raise #UD. A part that executes one of these
# instead of faulting has diverged from its own manual.
subsystem: fault
oracle: architecture
entries:
  - id: ud-ud2
    clause: "Intel SDM Vol. 2B UD2: 'Generates an invalid opcode exception'"
    class: fault
    guarantee: architectural
    bytes: "0f0b"
    expect: UD
  - id: ud-ud1
    clause: "Intel SDM Vol. 2B UD1 (0F B9): raises #UD"
    class: fault
    guarantee: architectural
    bytes: "0fb9"
    expect: UD
  - id: ud-ud0
    clause: "Intel SDM Vol. 2B UD0 (0F FF): raises #UD"
    class: fault
    guarantee: architectural
    bytes: "0fff"
    expect: UD
  - id: ud-lock-on-nop
    clause: "Intel SDM Vol. 2A 2.1.1: LOCK on an instruction that cannot be locked raises #UD"
    class: fault
    guarantee: architectural
    bytes: "f090"
    expect: UD
    note: LOCK NOP. The prefix is legal; applying it here is not.
  - id: ud-control-nop
    clause: "Intel SDM Vol. 2B NOP"
    class: fault
    guarantee: model-specific
    bytes: "90"
    expect: none
    note: >-
      The control: a plain NOP must NOT fault. It is marked model-specific so a
      surprise here is reported as not-assertable rather than as a chip defect —
      the harness must not be able to "find" a bug by mis-assembling its own
      test bytes.
