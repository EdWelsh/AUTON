# Hardware vendor document inventory (H1).
#
# What documents exist, per vendor: where, under what licence, at what cadence,
# in what form, and what key their errata are indexed by. This is the input to
# ingestion (H2/H3) and the thing the PRD's "vendors with an ingestion pipeline"
# metric is measured against.
#
# INVENTORIED IS NOT INGESTED. Every record here says a document exists and is
# reachable. None says it has been fetched, parsed or normalised. The coverage
# report keeps the two apart on purpose; conflating them would overstate
# progress by the entire remaining work.
#
# Licensing: most of these are freely downloadable and NOT freely
# redistributable. See README.md — ingest and derive, never vendor the source.
#
# URLs are hints, not identity. They rot; document numbers and titles do not.
# A record is identified by `id` plus the vendor's own document number.

version: 1
updated: 2026-09-14

vendors:

  # --- CPU / ISA ----------------------------------------------------------- #

  - vendor: intel
    category: cpu
    # The schema was designed against this entry first. Intel publishes four
    # kinds of document on four different cadences in three different forms;
    # a schema built for RISC-V's single open spec would break here immediately.
    identity_keys: [family, model, stepping, microcode_rev]
    documents:
      - id: intel-sdm
        title: Intel 64 and IA-32 Architectures Software Developer's Manual
        doc_number: "325462"
        kind: architecture-manual
        access: public-download
        redistributable: false
        form: pdf
        cadence: quarterly
        url_hint: https://www.intel.com/sdm
      - id: intel-spec-update
        title: Specification Update (per processor family)
        kind: errata
        scope: per-family
        access: public-download
        redistributable: false
        form: pdf-tables
        cadence: monthly
        notes: >-
          The canonical errata document. One per family, each an errata table
          keyed on stepping. This is the hardest parsing problem in the set and
          the reason H2 is scoped to Intel and AMD first.
      - id: intel-spec-update-6
        title: 6th Gen Core Specification Update
        kind: errata
        scope: per-family
        access: public-download
        redistributable: false
        form: pdf-tables
        cadence: monthly
        notes: >-
          H9 lineage member (agent/hardware/lineage.yaml). Doc number 332689 is a hint; verify it on the PDF's cover.
      - id: intel-spec-update-7
        title: 7th Gen Core Specification Update
        kind: errata
        scope: per-family
        access: public-download
        redistributable: false
        form: pdf-tables
        cadence: monthly
        notes: >-
          H9 lineage member (agent/hardware/lineage.yaml). Doc number 334663 is a hint; verify it on the PDF's cover.
      - id: intel-spec-update-8
        title: 8th/9th Gen Core Specification Update
        kind: errata
        scope: per-family
        access: public-download
        redistributable: false
        form: pdf-tables
        cadence: monthly
        notes: >-
          H9 lineage member (agent/hardware/lineage.yaml). Doc number 337346 is a hint; verify it on the PDF's cover.
      - id: intel-spec-update-10
        title: 10th Gen Core Specification Update
        kind: errata
        scope: per-family
        access: public-download
        redistributable: false
        form: pdf-tables
        cadence: monthly
        notes: >-
          H9 lineage member (agent/hardware/lineage.yaml). Doc number 615213 is a hint; verify it on the PDF's cover.
      - id: intel-spec-update-11
        title: 11th Gen Core Specification Update
        kind: errata
        scope: per-family
        access: public-download
        redistributable: false
        form: pdf-tables
        cadence: monthly
        notes: >-
          H9 lineage member (agent/hardware/lineage.yaml). Doc number not yet identified.
      - id: intel-spec-update-13
        title: 13th/14th Gen Core Specification Update
        kind: errata
        scope: per-family
        access: public-download
        redistributable: false
        form: pdf-tables
        cadence: monthly
        notes: >-
          H9 lineage member (agent/hardware/lineage.yaml). Doc number 740518 is a hint; verify it on the PDF's cover.
      - id: intel-sa
        title: Intel Security Advisories (INTEL-SA-*)
        kind: security-advisory
        access: public-web
        redistributable: false
        form: structured
        cadence: continuous
      - id: intel-microcode
