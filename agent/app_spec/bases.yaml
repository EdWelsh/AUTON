# Runtime -> the base image a package is built FROM (application-to-environment
# A8). The Packager may not choose a base; the gate refuses any FROM not listed
# here for the manifest's runtime. Pinned by multi-arch index digest, so the
# same line builds on arm64 and x86-64 and cannot drift under a moving tag.
#
# Refreshing a pin is a reviewed edit: `docker pull <tag>` then
# `docker image inspect --format '{{index .RepoDigests 0}}' <tag>`.

version: 1

bases:
  runtime:python-3.10: python:3.10-slim@sha256:6ff506466f8b1e981719b468cc0023b8ef000b983cdec0eafe119d01f379e31d
