# The generation campaign as data (docs/CAMPAIGN.md), read by scripts/campaign.py.
# Pre-registration: this file and goals/*.txt are committed before any run in
# them starts, and are not edited afterwards except by a dated amendment line.
#
#   base:   a kernel-base tag, or `run:<name>` — that run's resulting tree (its
#           workspace's main), so R2 builds on R1's memory manager.
#   seed:   files copied into the workspace before session 1, committed as part
#           of the base: frozen interfaces the agent implements against, and
#           local-only inputs (doomgeneric, the WAD) that never enter the repo.
#   gates:  in order; each runs from the repo root with KERNEL_TREE=<workspace>.
#           exit 0 pass, 1 generated wrong, 2 not generated.
#   fallback: what replaces a phase that fails both attempts (stop rules 2, 3),
#           labelled `authorship: human`; `none` leaves the phase failed and
#           its dependants run on the last good tree.
#           `tree:<attempt>` (amended 2026-10-06): that attempt's tree, which
#           failed its suites but passed its end-to-end gate, is the base its
#           dependants build on. `none` left R3 on a tree with no fs.h, which its
#           goal says exists: neither R3 attempt tested what was pre-registered.

# Amended 2026-10-02 (owner's decision): every run moves to Claude Sonnet 5.5 through the
# owner's subscription (claude -p; agent/orchestrator/llm/claude_cli.py), qualified 4/4 by
# scripts/model-probe.py, slowest call 21 s. Was ollama_chat/qwen3.5:27b-q8_0 at context 32768.
# Goals, bases, seeds, gates, sessions and stop rules are unchanged.
model: claude-cli/claude-sonnet-5-5
session_seconds: 18000
context: 200000

runs:
  - name: r1-mm
    attempt: 2                       # attempt 1 was w15; this is the last
    base: kernel-base-v5
    sessions: 4
    goal: goals/r1-mm.txt
    gates:
      - tests/kernel/run_mm_test.sh
      - tests/kernel/run_vmm_test.sh
      # Amended 2026-10-03 (stop rule 5): e2e.sh trains and checks SLM parity before it boots,
      # and parity fails on the untouched base tree, so this gate never booted anything.
      - scripts/boot-marker.sh "$KERNEL_TREE" '^\[MM\] PMM initialized'
    fallback: tree:r1-mm-attempt2      # boot gate passed: [MM] PMM initialized

  - name: r8-virtio-console
    base: kernel-base-v5
    sessions: 2
    goal: goals/r8-virtio-console.txt
    seed:
      tests/kernel/virtio_console_gate/include: tests/kernel/virtio_console_gate/include
      tests/kernel/virtio_reference/include: tests/kernel/virtio_reference/include
    gates:
      - tests/kernel/run_virtio_console_gate_test.sh
    fallback: none

  - name: r2-storage
    base: run:r1-mm
    sessions: 4
    goal: goals/r2-storage.txt
    gates:
      - tests/kernel/run_fat32_test.sh
      - scripts/run-storage-acceptance.sh "$KERNEL_TREE"
    # Amended 2026-10-05 (stop rule 5): the ring suite links the driver against the vnr_* API
    # of tests/kernel/virtio_reference/include/virtio_ref.h, which neither drivers.md nor this
    # goal names, and R2 was not seeded with it (R8 was). Recorded, not deciding; the boot
    # acceptance gate judges the driver end to end. Done (w23 G6): drivers.md now names the API
    # normative, so a later run that seeds the header can make this suite a gate.
    advisory:
      - tests/kernel/run_virtio_blk_test.sh
    fallback: tree:r2-storage-attempt2 # storage acceptance passed end to end

  - name: r3-fileserver
    base: run:r2-storage
    sessions: 2
    goal: goals/r3-fileserver.txt
    gates:
      - tests/kernel/run_fileserver_test.sh
      - scripts/run-storage-acceptance.sh "$KERNEL_TREE" --service fileserver
    fallback: none

  - name: r6-host-repo
    base: run:r2-storage
    sessions: 2
    goal: goals/r6-host-repo.txt
    gates:
      - tests/kernel/run_host_repo_test.sh
      - tests/kernel/run_host_repo_test.sh --clone
    fallback: none

  - name: r5-smtp
    base: run:r2-storage
    sessions: 2
    goal: goals/r5-smtp.txt
    gates:
      - tests/kernel/run_smtp_test.sh
      - scripts/run-storage-acceptance.sh "$KERNEL_TREE" --service smtp
    fallback: none

  - name: r4-kvstore
    base: run:r2-storage
    sessions: 2
    goal: goals/r4-kvstore.txt
    gates:
      - tests/kernel/run_kvstore_test.sh
      - scripts/run-storage-acceptance.sh "$KERNEL_TREE" --service kvstore
    fallback: none

  - name: r7-ssh
    base: run:r2-storage
    sessions: 3
    goal: goals/r7-ssh.txt
    # Amended 2026-10-09 (stop rule 5): attempt 1 was invalid — the goal says to use Monocypher
    # and BearSSL, vendored unmodified, and the session had no copy of either (the reviewer
    # rejected a header-only change three times). Staged by tests/crypto/fetch_sources.sh
    # (already judged by tests/crypto/run_crypto_gate.sh) and seeded, like R12's assets.
    seed:
      third_party/monocypher: .cache/vendor/crypto/Monocypher-4.0.2
      third_party/bearssl: .cache/vendor/crypto/bearssl
    gates:
      - tests/kernel/run_ssh_test.sh
    fallback: none

  - name: r12-doom
    base: run:r1-mm
    sessions: 3
    goal: goals/r12-doom.txt
    seed:
      third_party/doomgeneric: .cache/third_party/doomgeneric
      assets/doom.wad: .cache/assets/DOOM1.WAD
    gates:
      - tests/kernel/run_play_doom_test.sh
      - make -C "$KERNEL_TREE" iso
      - mkdir -p "$KERNEL_TREE/build/assets" && cp "$KERNEL_TREE/assets/doom.wad" "$KERNEL_TREE/build/assets/doom.wad" && scripts/run-intent-probe.sh doom "$KERNEL_TREE/build"
    fallback: none

  - name: r11-conformance
    base: run:r1-mm
    sessions: 2
    goal: goals/r11-conformance.txt
    gates:
      - tests/kernel/run_fault_harness_test.sh
    fallback: none

  - name: r10-f00f
    base: run:r1-mm
    sessions: 1
    goal: goals/r10-f00f.txt
    gates:
      - scripts/boot-marker.sh "$KERNEL_TREE" 'F00F.*(applied|verified)'   # amended 2026-10-03, as R1
    fallback: none

  - name: r9-aarch64
    base: kernel-base-v5
    sessions: 3
    goal: goals/r9-aarch64.txt
    gates:
      - tests/kernel/run_dtb_test.sh
    fallback: none
